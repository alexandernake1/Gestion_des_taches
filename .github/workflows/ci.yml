name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: activity_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: activity_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py check
      - run: python backend/manage.py spectacular --validate --file /tmp/schema.yml
      - run: pytest backend -q
      - name: Validate production security settings
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-production-check-only-9zY7pV4mR2xK8cN6qW3sT5uA1dF0hJ4lB7eG"
          ALLOWED_HOSTS: preprod.example.test
          CORS_ALLOWED_ORIGINS: https://preprod.example.test
          CSRF_TRUSTED_ORIGINS: https://preprod.example.test
          APP_FRONTEND_URL: https://preprod.example.test
          JWT_COOKIE_SECURE: "True"
          SECURE_SSL_REDIRECT: "True"
          USE_IN_MEMORY_CHANNEL_LAYER: "False"
          WEBSOCKET_ALLOW_QUERY_TOKEN: "False"
          PAYMENT_PROVIDER: disabled
        run: |
          python backend/manage.py check --deploy --tag security --fail-level WARNING
          python backend/manage.py check_preproduction

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run --pool=threads --maxWorkers=1
      - run: npm run lint
      - run: npm run build

  compose-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_PASSWORD: ci-compose-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
