services:
  postgres:
    image: postgres:15-alpine
    container_name: activity_tracker_db
    environment:
      POSTGRES_DB: activity_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: activity_tracker_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: activity_tracker_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    # We expose port 8000 internally, but nginx will route to it. No need to bind to host port 8000 unless desired.
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: activity_tracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
