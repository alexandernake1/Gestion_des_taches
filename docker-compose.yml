services:
  postgres:
    image: postgres:15-alpine
    container_name: activity_tracker_db
    environment:
      POSTGRES_DB: ${DB_NAME:-activity_tracker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: activity_tracker_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: activity_tracker_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  frontend:
    build: ./frontend
    container_name: activity_tracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  static_data:
  media_data:
