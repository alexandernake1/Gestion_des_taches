      operationId: api_notifications_list
      description: List notifications for the current user
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - approval_approved
          - approval_rejected
          - approval_requested
          - comment
          - daily_digest
          - new_assignment
          - new_task
          - payment_failed
          - payment_succeeded
          - report_approved
          - report_rejected
          - subscription_reminder
          - subscription_suspended
          - task_completed
          - task_due_soon
          - task_overdue
        description: |-
          * `new_task` - Nouvelle tâche
          * `comment` - Commentaire
          * `report_approved` - Report accepté
          * `report_rejected` - Report refusé
          * `new_assignment` - Nouvelle assignation
          * `task_completed` - Tâche terminée
          * `subscription_reminder` - Rappel d’abonnement
          * `payment_succeeded` - Paiement réussi
          * `payment_failed` - Paiement échoué
          * `subscription_suspended` - Abonnement suspendu
          * `task_due_soon` - Échéance proche
          * `task_overdue` - Tâche en retard
          * `daily_digest` - Résumé quotidien
          * `approval_requested` - Validation demandée
          * `approval_approved` - Validation approuvée
          * `approval_rejected` - Validation refusée
      tags:
      - api
      security:
      - cookieJwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
