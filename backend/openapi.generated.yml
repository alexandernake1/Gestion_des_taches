openapi: 3.0.3
info:
  title: Activity Tracking API
  version: 1.0.0
  description: Enterprise activity tracking platform API
paths:
  /api/auth/change-password/:
    post:
      operationId: api_auth_change_password_create
      description: Change user password
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - cookieJwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
  /api/auth/google/:
    post:
      operationId: api_auth_google_create
